<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufgaben Manager</title>
    <link rel="stylesheet" href="/css/main.css">

    <link rel="icon" type="image/png" href="/img/favicon.png">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>TaskManager</h2>

        <button class="team active">
            🏠 Privat
        </button>

        <h3>Teams</h3>

        <div class="team-list">
            <button class="team">👨‍💻 Entwickler</button>
            <button class="team">🎨 Design</button>
            <button class="team">📈 Marketing</button>
            <button class="team">💼 Management</button>
        </div>

    </aside>

    <!-- Hauptbereich -->
    <div class="content">

        <header>

            <div class="logo">
                Entwickler
            </div>

            <nav>
                <!-- Hier später Navigation -->
                <span>Navigation Platzhalter</span>
            </nav>

        </header>

        <main>
            <div id="modal-overlay" class="overlay hidden">
                <div id="board-creation-card" class="board-creation">
                    <h2>Neues Board</h2>
                    <input type="text" name="board-name-input" placeholder="Name">

                    <button id="board-creation-button" type="button">Erstellen</button>
                </div>
            </div>

            <h1>Boards</h1>

            <section class="boards">

                <div class="board">
                    <h2>Projekt Alpha</h2>
                    <p>12 Aufgaben</p>
                </div>

                <div class="board">
                    <h2>Website</h2>
                    <p>8 Aufgaben</p>
                </div>

                <div class="board">
                    <h2>Backend</h2>
                    <p>20 Aufgaben</p>
                </div>

                <div class="board">
                    <h2>App</h2>
                    <p>4 Aufgaben</p>
                </div>

                <div id="create-board-button" class="board add-board">
                    <span>＋</span>
                    <p>Neues Board</p>
                </div>

            </section>

        </main>

    </div>

</div>

<script src="/js/main.js"></script>
</body>
</html>
