<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager - Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <h1>TaskManager</h1>
        <p class="subtitle">Melde dich an, um deine Boards zu verwalten.</p>

        <form>

            <div class="input-group">
                <label>E-Mail</label>
                <input
                    type="email"
                    placeholder="name@email.de"
                    required>
            </div>

            <div class="input-group">
                <label>Passwort</label>
                <input
                    type="password"
                    placeholder="••••••••"
                    required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Angemeldet bleiben
                </label>

                <a href="#">Passwort vergessen?</a>
            </div>

            <button type="submit">
                Anmelden
            </button>

        </form>

    </div>

</div>

</body>
</html>
